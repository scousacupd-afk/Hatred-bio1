<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    gap: 24px;
    padding: 40px 20px;
  }
  .shop-title {
    color: #fff;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
    opacity: 0.3;
    margin-bottom: 4px;
  }
  @keyframes rainbow-spin {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .card {
    position: relative;
    border-radius: 6px;
    padding: 2px;
    width: 250px;
    transition: transform 0.2s ease;
    cursor: pointer;
  }
  .card:hover { transform: scale(1.04); }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: linear-gradient(
      90deg,
      #ff0000, #ff7700, #ffff00, #00ff00,
      #0077ff, #8800ff, #ff00ff, #ff0000,
      #ff7700, #ffff00, #00ff00, #0077ff,
      #8800ff, #ff00ff, #ff0000
    );
    background-size: 300% 100%;
    animation: rainbow-spin 2s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .card-inner {
    background: #0d0d0d;
    border-radius: 4px;
    padding: 20px 22px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .card-title {
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
  }
  .cashapp-btn {
    display: inline-block;
    background: #00D632;
    color: #000;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 7px 18px;
    border-radius: 4px;
    text-decoration: none;
    text-transform: uppercase;
    transition: opacity 0.15s;
  }
  .cashapp-btn:hover { opacity: 0.85; }
  .donate-btn {
    display: inline-block;
    background: #ff4d4d;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 7px 18px;
    border-radius: 4px;
    text-decoration: none;
    text-transform: uppercase;
    transition: opacity 0.15s;
  }
  .donate-btn:hover { opacity: 0.85; }
  .notice {
    color: #888;
    font-size: 11px;
    font-family: 'Share Tech Mono', monospace;
    text-align: center;
    letter-spacing: 0.5px;
    line-height: 1.5;
  }
  .heart {
    font-size: 20px;
    line-height: 1;
  }
</style>
</head>
<body>
<p class="shop-title">Store</p>

<!-- BUY FP -->
<div class="card" id="BUYFP">
  <div class="card-inner">
    <span class="card-title">Buy Finger Painter For $5</span>
    <a class="cashapp-btn" href="https://cash.app/$avielsamueljs" target="_blank">Pay via CashApp</a>
    <p class="notice">Once purchased, make a ticket<br>in the discord.</p>
  </div>
</div>

<!-- BUY EVERYCOSMETIC -->
<div class="card" id="BUYEVERYCOSMETIC">
  <div class="card-inner">
    <span class="card-title">Buy Every Cosmetic For $15</span>
    <a class="cashapp-btn" href="https://cash.app/$avielsamueljs" target="_blank">Pay via CashApp</a>
    <p class="notice">Once purchased, make a ticket<br>in the discord.</p>
  </div>
</div>

<!-- DONATE -->
<div class="card" id="DONATE">
  <div class="card-inner">
    <span class="heart">❤️</span>
    <span class="card-title">Donate</span>
    <a class="donate-btn" href="https://cash.app/$avielsamueljs" target="_blank">Donate via CashApp</a>
    <p class="notice">Support the CCU — any amount<br>is appreciated. Thank you!</p>
  </div>
</div>

<script>
  const path = window.location.pathname;
  const match = path.match(/\/api\/([A-Z]+)/i);
  if (match) {
    const target = match[1].toUpperCase();
    const el = document.getElementById(target);
    if (el) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.transform = 'scale(1.07)';
        setTimeout(() => el.style.transform = '', 600);
      }, 200);
    }
  }
</script>
</body>
</html>
