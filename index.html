<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy FP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    gap: 20px;
    padding: 40px 20px;
  }
  .shop-title {
    color: #fff;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
    opacity: 0.3;
  }
  @keyframes rainbow-spin {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .product-wrap {
    position: relative;
    border-radius: 6px;
    padding: 2px;
    width: 280px;
  }
  .product-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: linear-gradient(90deg,#ff0000,#ff7700,#ffff00,#00ff00,#0077ff,#8800ff,#ff00ff,#ff0000,#ff7700,#ffff00,#00ff00,#0077ff,#8800ff,#ff00ff,#ff0000);
    background-size: 300% 100%;
    animation: rainbow-spin 2s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .product-inner {
    background: #0d0d0d;
    border-radius: 4px;
    padding: 28px 26px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .product-name {
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
  }
  .divider {
    width: 100%;
    height: 1px;
    background: #222;
  }
  .product-price {
    font-family: 'Share Tech Mono', monospace;
    font-size: 36px;
    color: #fff;
    letter-spacing: 2px;
  }
  .notice {
    color: #888;
    font-size: 11px;
    font-family: 'Share Tech Mono', monospace;
    text-align: center;
    letter-spacing: 0.5px;
    line-height: 1.6;
  }
  .buy-btn {
    display: block;
    width: 100%;
    background: #00D632;
    color: #000;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 2px;
    padding: 12px 0;
    border-radius: 4px;
    text-decoration: none;
    text-align: center;
    text-transform: uppercase;
    transition: opacity 0.15s;
  }
  .buy-btn:hover { opacity: 0.85; }
  .back-link {
    color: #444;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    transition: color 0.15s;
  }
  .back-link:hover { color: #aaa; }
</style>
</head>
<body>
<p class="shop-title">Store</p>
<div class="product-wrap">
  <div class="product-inner">
    <span class="product-name">FP</span>
    <div class="divider"></div>
    <span class="product-price">$15</span>
    <p class="notice">Once purchased, make a ticket<br>in the discord.</p>
    <a class="buy-btn" href="https://cash.app/$avielsamueljs/15" target="_blank">BUY NOW — $15</a>
  </div>
</div>
<a class="back-link" href="https://classic-tag-donate.vercel.app/">← Back to store</a>
</body>
</html>
